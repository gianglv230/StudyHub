<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Trang chủ | StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../globals.css" />
    <link rel="stylesheet" href="student-globals.css" />
  </head>
  <body>
    <style>
      .avatar-border {
        border: 4px solid rgba(128, 128, 128, 0.2);
        width: fit-content;
        height: fit-content;
        border-radius: 50%;
        padding: 1px;
      }
      .avatar {
        border: 2px solid white;
      }
      .avatar-pencil {
        background: var(--primary-container);
        color: white;
        height: 40px;
        width: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        border: 2px solid white;
        position: absolute;
        bottom: 0px;
        right: 0px;
        transition: transform 0.2s;
      }
      .avatar-pencil:hover {
        transform: scale(1.1);
        cursor: pointer;
      }
      .role {
        background-color: var(--primary-container-light);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }

      .personal-info-form label {
        color: var(--primary-color);
        font-weight: 500;
      }

      /* .form-input {
        border: 1px solid gray;
        padding: 12px 12px;
        margin-bottom: 8px;
      }

      .form-input:focus {
        border: 1px solid var(--primary-color);
      } */

    </style>
    <section class="container mt-5">
      <div class="row">
        <div class="col-4">
          <div class="bg-white rounded-4 shadow-sm pt-3 pb-4 px-4">
            <div class="d-flex justify-content-center mb-3">
              <div class="avatar-border position-relative">
                <img
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYy-WnQEhLkOPRSB3t02UoktnpsGKdK4xhVULJPa2ok_CP1xsgbTC95dRjcCrj5Iq4c2kdsXzXNTt_3j8_nMUzDwlPUfubLd5QRxsZwFOQjSPldJclp5HVrYlhbrLps1oxaD7CNYr4HlLS6fMTO7pIXp3kRxTpVSS8sPCCP_S4A7gqZZodNsZi_Jp55m3pmMtAmNVJ6SqjJtS4VLUrASsh3J0DRVQ86rFHe1wnpsU5-GEy1BhakFjUmoEXTAQZCitZ6YIlAEITAwEB"
                  alt="Avatar"
                  class="img-fluid rounded-circle avatar"
                  width="140"
                  height="140"
                />
                <div class="avatar-pencil">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-pencil-fill"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"
                    />
                  </svg>
                </div>
              </div>
            </div>
            <p class="text-center mb-3 text-primary-container h5 fw-normal">
              Nguyễn Văn A
            </p>
            <div class="d-flex justify-content-center">
              <div class="badge text-center role rounded-pill py-2 px-4">
                <div class="d-flex align-items-center">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    fill="currentColor"
                    class="bi bi-mortarboard-fill me-2"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917z"
                    />
                    <path
                      d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466z"
                    />
                  </svg>
                  <span class="d-inline-block">HỌC VIÊN</span>
                </div>
              </div>
            </div>
            <hr class="my-4" />
            <button class="btn btn-primary-custom w-100 py-2 fw-normal mb-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                fill="currentColor"
                class="bi bi-floppy-fill me-2"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 1.5A1.5 1.5 0 0 1 1.5 0H3v5.5A1.5 1.5 0 0 0 4.5 7h7A1.5 1.5 0 0 0 13 5.5V0h.086a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5H14v-5.5A1.5 1.5 0 0 0 12.5 9h-9A1.5 1.5 0 0 0 2 10.5V16h-.5A1.5 1.5 0 0 1 0 14.5z"
                />
                <path
                  d="M3 16h10v-5.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5zm9-16H4v5.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5zM9 1h2v4H9z"
                />
              </svg>
              <span>Lưu</span>
            </button>
            <button class="btn btn-outline-primary-custom w-100 py-2 fw-normal mt-1">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                class="bi bi-arrow-clockwise"
                viewBox="0 0 16 16"
              >
                <path
                  fill-rule="evenodd"
                  d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"
                />
                <path
                  d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"
                />
              </svg>
              <span>Thay đổi mật khẩu</span>
            </button>
          </div>
        </div>
        <div class="col-8">
          <form class="bg-white rounded-4 shadow-sm py-4 personal-info-form">
            <div class="d-flex justify-content-between px-4">
              <h3>Thông tin cá nhân</h3>
              <div class="d-flex align-items-center cursor-pointer">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="25"
                  height="25"
                  fill="currentColor"
                  class="bi bi-pencil-square text-primary-container me-2"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
                  />
                  <path
                    fill-rule="evenodd"
                    d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
                  />
                </svg>
                <span class="d-inline-block h5 mb-0 text-primary-container"
                  >Sửa</span
                >
              </div>
            </div>
            <hr class="text-muted my-4" />
            <div class="px-4 text-primary-container">
              <div class="row g-3">
                <div class="col-6">
                  <div>
                    <label for="firstname" class="form-label"
                      >Họ và họ đệm</label
                    >
                    <input
                      type="text"
                      class="form-control form-input"
                      id="firstname"
                      placeholder="Nguyễn Văn"
                    />
                  </div>
                </div>
                <div class="col-6">
                  <label for="lastname" class="form-label"
                    >Tên</label
                  >
                  <input
                    type="text"
                    class="form-control form-input"
                    id="lastname"
                    placeholder="A"
                  />
                </div>
                <div class="col-6">
                  <label for="gender" class="form-label"
                    >Giới tính</label
                  >
                  <select name="gender" id="gender" class="form-select form-input">
                    <option value="0" selected>Nam</option>
                    <option value="1">Nữ</option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="dob" class="form-label"
                    >Ngày sinh</label
                  >
                  <input
                    type="date"
                    class="form-control form-input"
                    id="dob"
                    placeholder="A"
                  />
                </div>
                <div class="col-12">
                  <label for="hometown" class="form-label"
                    >Quê quán</label
                  >
                  <input
                    type="text"
                    class="form-control form-input"
                    id="hometown"
                    placeholder="Phường Cầu Giấy, Thành phố Hà Nội"
                  />
                </div>
                <div class="col-12">
                  <label for="address" class="form-label"
                    >Địa chỉ</label
                  >
                  <input
                    type="text"
                    class="form-control form-input"
                    id="address"
                    placeholder="Phường Cầu Giấy, Thành phố Hà Nội"
                  />
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

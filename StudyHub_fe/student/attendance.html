<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Lớp AAA - Student | StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../globals.css" />
    <link rel="stylesheet" href="student-globals.css" />
  </head>
  <body>
    <style>
      .back-arrow {
        transition: transform 0.2s;
      }
      .back-btn:hover .back-arrow {
        transform: translateX(-5px);
      }
    </style>
    <style>
      .attendance-header {
        border-top: 1px solid var(--border-color);
      }
      .attendance-row {
        border-bottom: 1px solid var(--border-color);
        padding-top: 10px;
        padding-bottom: 10px;
      }
    </style>
    <section class="container mt-5">
      <a href="#" class="text-decoration-none back-btn">
        <div class="d-flex align-items-center text-primary-container">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="23"
            height="23"
            fill="currentColor"
            class="bi bi-arrow-left-short me-2 back-arrow"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"
            />
          </svg>
          <span>Trở lại danh sách bài học</span>
        </div>
      </a>
      <div class="row mb-4">
        <div class="col-9">
          <h1 class="mt-3 mb-2">Vật lý 1</h1>
          <div class="d-flex justify-content-between mb-3">
            <div class="d-flex align-items-center mb-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-person-fill me-2 text-primary-container"
                viewBox="0 0 16 16"
              >
                <path
                  d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
                />
              </svg>
              <span class="text-primary-container fw-bold"
                >Học viên: Nguyễn Văn A</span
              >
            </div>
          </div>
        </div>
        <div class="col-3">
          <div class="bg-white rounded-4 shadow-sm px-3 py-3">
            <p class="mb-2 small text-muted">Tổng quan khóa học</p>
            <p class="mb-1 text-danger h4 fw-bold">Số buổi vắng: 2</p>
            <p class="mb-1 small text-primary-container">
              Tổng số buổi đã điểm danh: 15
            </p>
            <div class="progress my-2" style="height: 8px">
              <div
                class="progress-bar bg-primary-container rounded-3"
                style="width: 87%"
              ></div>
            </div>
            <p class="text-end text-muted small fs-12 mb-0">
              Tỷ lệ chuyên cần: 87%
            </p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-4 shadow-sm px-5 py-4">
        <h3 class="mt-2 mb-4 fw-medium">Lịch sử chuyên cần</h3>
        <div class="row attendance-header attendance-row">
          <div class="col-2">
            <span class="fw-bold text-uppercase fs-18 text-secondary ls-1"
              >Buổi học</span
            >
          </div>
          <div class="col-2">
            <span class="fw-bold text-uppercase fs-18 text-secondary ls-1"
              >Ngày</span
            >
          </div>
          <div class="col-3 text-center">
            <span class="fw-bold text-uppercase fs-18 text-secondary ls-1"
              >Trạng thái</span
            >
          </div>
          <div class="col-5">
            <span class="fw-bold text-uppercase fs-18 text-secondary ls-1"
              >Ghi chú</span
            >
          </div>
        </div>
        <div class="row attendance-row">
          <div class="col-2">
            <span class="fw-bold fs-16 text-primary-container"
              >Buổi 2</span
            >
          </div>
          <div class="col-2">
            <span class="text-dark"
              >10/05/2026</span
            >
          </div>
          <div class="col-3 text-center">
            <span class="badge bg-danger rounded-pill">Vắng mặt</span>
          </div>
          <div class="col-5">
            <span class="text-secondary fst-italic"
              >Không có lý do</span
            >
          </div>
        </div>
        <div class="row attendance-row">
          <div class="col-2">
            <span class="fw-bold fs-16 text-primary-container"
              >Buổi 1</span
            >
          </div>
          <div class="col-2">
            <span class="text-dark"
              >03/05/2026</span
            >
          </div>
          <div class="col-3 text-center">
            <span class="badge bg-success rounded-pill">Có mặt</span>
          </div>
          <div class="col-5">
            <span class="text-secondary fst-italic"
              >_</span
            >
          </div>
        </div>
      </div>
    </section>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

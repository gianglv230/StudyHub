<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Liên hệ | StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  </head>
  <body>
    <section class="container-fluid contact bg-light py-5">
      <div class="container py-5">
        <div class="mx-auto text-center mb-5" style="max-width: 900px">
          <h5 class="section-title px-3 text-uppercase">LIên hệ chúng tôi</h5>
          <h1 class="mb-3">Liên hệ ngay nếu bạn cần hỗ trợ</h1>
        </div>
        <div class="row align-items-center mt-2 bg-white rounded p-4 shadow-lg">
          <div class="text-center mb-4 col">
            <i
              class="fa fa-map-marker-alt fa-3x text-primary-container mb-3"
              aria-hidden="true"
            ></i>
            <h4 class="text-primary-container">Địa chỉ</h4>
            <p class="mb-0 fs-5 text-primary-container">Hà Nội</p>
          </div>
          <div class="text-center mb-4 col">
            <i
              class="fa fa-phone-alt fa-3x text-primary-container mb-3"
              aria-hidden="true"
            ></i>
            <h4 class="text-primary-container">Mobile</h4>
            <p class="mb-0 fs-5 text-primary-container">0343 857 961</p>
          </div>
          <div class="text-center mb-4 col">
            <i
              class="fa fa-envelope-open fa-3x text-primary-container mb-3"
              aria-hidden="true"
            ></i>
            <h4 class="text-primary-container">Email</h4>
            <p class="mb-0 fs-5 text-primary-container">support@studyhub.com</p>
          </div>
        </div>
      </div>
    </section>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

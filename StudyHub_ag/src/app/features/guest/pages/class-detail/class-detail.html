@if (class) {
  <section class="container contact bg-light py-5">
    <h2>{{ class.className }}</h2>
    <div class="row mt-3">
      <div class="col-12 col-lg-8 mb-2">
        <app-course-detail-info [course]="class" />
      </div>
      <div class="col-12 col-lg-4 mt-4 mt-lg-0">
        <app-course-overview-info [course]="class" />

        <app-class-overview-info [class]="class" />
      </div>
    </div>
  </section>
} @else {
  <app-spinner />
}

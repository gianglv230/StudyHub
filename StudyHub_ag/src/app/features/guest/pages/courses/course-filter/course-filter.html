  @for (item of targets; track $index) {
    <div>
      <a
        class="text-decoration-none target-grade-card d-block"
        [routerLink]="[]"
        [class.selected]="isActive(item)"
        routerLinkActive="selected"
        [queryParams]="{ target: item, page: 1 }"
        [queryParamsHandling]="'merge'"
      >
        <span class="text-nowrap">{{ item }}</span>
      </a>
    </div>
  }
</div>

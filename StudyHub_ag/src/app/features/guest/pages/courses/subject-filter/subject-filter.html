  <div class="subject-tab">
    <a
      class="text-decoration-none"
      [routerLink]="[]"
      [class.selected]="!subject"
      routerLinkActive="selected"
      [queryParams]="{ subject: '', page: 1 }"
      [queryParamsHandling]="'merge'"
    >
      <p class="text-center">Tất cả</p>
    </a>
  </div>
  @for (item of subjects; track $index) {
    <div class="subject-tab">
      <a
        class="text-decoration-none"
        [routerLink]="[]"
        [class.selected]="isActive(item)"
        routerLinkActive="selected"
        [queryParams]="{ subject: item, page: 1 }"
        [queryParamsHandling]="'merge'"
      >
        <p class="text-center">{{ item }}</p>
      </a>
    </div>
  }
</div>

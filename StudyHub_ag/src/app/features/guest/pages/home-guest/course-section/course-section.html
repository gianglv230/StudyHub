<!-- Featured Courses -->
<section class="container py-4 mt-4">
  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end mb-3 mb-lg-4 gap-3"
  >
    <div>
      <h2 class="mb-1">{{ title }}</h2>
      <p class="text-muted mb-0">
        {{ description }}
      </p>
    </div>
  </div>
  <div class="row g-4">
    @for (item of courseLiteProjections; track item.courseId) {
      <div class="col-6 col-md-6 col-lg-3">
        <app-course-lite-card [card]="item" />
      </div>
    }
  </div>
</section>

<!-- Hero Section -->
<header class="hero-section">
  <div class="container">
    <div class="row align-items-center g-4 g-lg-5">
      <div class="col-lg-6 text-center text-lg-start">
        <span class="badge-education">Học tốt hôm nay, tự tin ngày mai</span>
        <h1 class="hero-title">
          Môi trường học tập chất lượng, thầy cô tận tâm đồng hành
        </h1>
        <p class="hero-text mx-auto mx-lg-0">
          Rất nhiều học viên đã tiến bộ và đạt kết quả tốt hơn sau khi học tại
          trung tâm.
        </p>
        <div
          class="d-flex flex-column flex-sm-row gap-3 justify-content-center"
        >
          <button
            class="btn btn-primary-custom px-5 py-3 fs-5 w-100"
            style="
              background-color: #f4d5bc;
              color: var(--text-main);
              box-shadow: 0 10px 15px -3px rgba(244, 213, 188, 0.4);
            "
          >
            Khám phá các khóa học ngay!
          </button>
        </div>
      </div>
      <div class="col-lg-6">
        <div
          class="hero-image-container mx-auto ms-lg-auto"
          style="max-width: 550px"
        >
          <div class="hero-shape-bg"></div>
          <img
            alt="Student learning"
            class="hero-img"
            src="assets/images/banner_image.jpg"
          />
        </div>
      </div>
    </div>
  </div>
</header>

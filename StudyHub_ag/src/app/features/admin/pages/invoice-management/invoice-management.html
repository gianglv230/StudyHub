<div
  class="main-content-header d-flex justify-content-between align-items-center"
>
  <div>
    <p class="text-primary-container ls-1 mb-0 fs-17">Quản lý hóa đơn</p>
    <p class="text-secondary ls-1 small">
      Quản lý và cập nhật danh sách các hóa đơn hiện có trên hệ thống
    </p>
  </div>
</div>
<app-invoice-searchbox (filterEvent)="handleFilter($event)" />
@if (pageData && pageData.data.length > 0) {
  <app-invoice-result
    [rowData]="pageData.data"
    [currentPage]="currentPage!"
    [pageSize]="pageSize!"
    [totalPages]="totalPages!"
    [paginationModel]="paginationModel"
  />
} @else {
  <div class="bg-white rounded-4 px-3 pt-4 pb-4 mt-4 border">
    <app-empty />
  </div>
}

<div class="bg-border-color-light rounded-4 px-3 pt-2 pb-4 mt-4 border">
  <h4 class="text-primary-container fw-bold my-3">
    Có {{ pageData?.totalElements || 0 }} kết quả được tìm thấy
  </h4>
  <hr />
  @if (pageData && pageData.data.length > 0) {
    <div class="row g-4">
      <!-- Course Card 2 -->
      @for (item of pageData.data; track $index) {
        <div class="col-12 col-md-6 col-lg-4 col-xl-3">
          <app-admin-course-card [card]="item" />
        </div>
      }
    </div>

    <app-pagination [paginationModel]="pagination!" />
  } @else {
    <app-empty />
  }
</div>

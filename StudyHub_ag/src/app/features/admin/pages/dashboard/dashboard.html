<!-- Charts Row -->
<div class="row g-4 mb-4 mb-md-5">
  <div class="col-lg-8">

            Doanh thu theo tháng trong năm

                    Performance overview for 2024
                  </p> -->

          <option>2025</option>

        </select>

    </div>
  </div>
  <div class="col-lg-4">
    <div class="chart-container h-100 bg-white rounded-3 px-4 py-3">
      <h3 class="h5 fw-bold mb-3" style="color: var(--primary-color)">
        Tỷ lệ điểm danh tháng này
      </h3>
      <!-- <p class="small text-secondary mb-4 badge bg-success">Average participation</p> -->
      <div class="circular-chart mb-4">
        <svg class="w-100 h-100" viewBox="0 0 36 36">
          <path
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
            fill="none"
            stroke="#f1f5f9"
            stroke-width="3"

          <path

        </svg>
        <div
          class="position-absolute top-50 start-50 translate-middle text-center"

          <div class="h4 fw-bold m-0" style="color: var(--primary-color)">
            92%
          </div>
          <div
            class="text-uppercase text-secondary fw-bold"

      <div class="mt-3">

            mặt</span

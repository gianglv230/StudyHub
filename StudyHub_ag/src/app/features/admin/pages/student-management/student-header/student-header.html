<div
  class="row main-content-header d-flex justify-content-between align-items-center mb-3 mb-md-0"
>
  <div class="col-auto">
    <p class="text-primary-container ls-1 mb-0 fs-17">Quản lý {{isStudent ? 'học viên' : 'giáo viên'}}</p>
    <p class="text-secondary ls-1 small mb-1">
      Quản lý và cập nhật danh sách các {{isStudent ? 'học viên' : 'giáo viên'}} hiện có trên hệ thống
    </p>
  </div>
  <div class="col-12 col-md-auto">
    <a
      class="btn btn-primary-custom align-items-center py-2 px-3"
      style="height: fit-content"
      [routerLink]="isStudent ? ['/admin/quan-ly-hoc-vien/bieu-mau'] : ['/admin/quan-ly-giao-vien/bieu-mau']"
      target="_blank"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        fill="currentColor"
        class="bi bi-plus-lg me-1"
        viewBox="0 0 16 16"
      >
        <path
          fill-rule="evenodd"
          d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"
        />
      </svg>
      <span class="fs-14">Thêm {{isStudent ? 'học viên' : 'giáo viên'}} mới</span>
    </a>
  </div>
</div>

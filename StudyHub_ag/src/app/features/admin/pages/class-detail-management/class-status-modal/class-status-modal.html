<div class="modal-body rounded-2 bg-background">
  <div class="px-2 pt-2">
    <div class="d-flex justify-content-between mb-2">
      <div class="h4 text-center text-primary-container text-uppercase fw-bold">
        Cập nhật trạng thái lớp học
      </div>
      <div>
        <button
          type="button"
          class="btn-close"
          (click)="activeModal.dismiss()"
        ></button>
      </div>
    </div>
    @if (form && cboxData) {
      <div [formGroup]="form">
        <app-form-select
          [control]="getControl(form, 'status')"
          [data]="cboxData"
          label="Trạng thái mới"
        />
      </div>
    }
  </div>
  <div class="d-flex justify-content-center">
    <button
      class="btn btn-primary-custom mt-2 text-center py-1"
      (click)="submit()"
    >
      Cập nhật
    </button>
  </div>
</div>

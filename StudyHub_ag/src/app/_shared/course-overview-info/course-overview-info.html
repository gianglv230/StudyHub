@if (course) {
  <div class="shadow px-4 pt-3 pb-2 py-md-4 rounded-4 info-sticky mb-4">
    <h4 class="mb-3">Thông tin chung</h4>
    <app-info-field
      class="pb-1"
      classInfo="fs-17 fw-bold text-primary-container h5"
      label="Môn học"
      [value]="course.subject"
    >
      <app-dynamic-icon
        width="16"
        height="16"
        fill="currentColor"
        iconClass="me-2 text-primary-container"
        viewBox="0 0 16 16"
        icon="book"
      />
    </app-info-field>

    <app-info-field
      class="pb-1"
      classInfo="fs-17 fw-bold text-primary-container h5"
      label="Danh mục"
      [value]="course.categoryName"
    >
      <app-dynamic-icon
        width="16"
        height="16"
        fill="currentColor"
        iconClass="me-2 text-primary-container"
        viewBox="0 0 16 16"
        icon="bookmark"
      />
    </app-info-field>

    <app-info-field
      class="pb-1"
      classInfo="fs-17 fw-bold text-primary-container h5"
      label="Dành cho"
      [value]="course.targetGrade"
    >
      <app-dynamic-icon
        width="16"
        height="16"
        fill="currentColor"
        iconClass="me-2 text-primary-container"
        viewBox="0 0 16 16"
        icon="target"
      />
    </app-info-field>

    <app-info-field
      class="pb-1"
      classInfo="fs-17 fw-bold text-primary-container h5"
      label="Số buổi học"
      [value]="course.numberOfLessons"
    >
      <app-dynamic-icon
        width="16"
        height="16"
        fill="currentColor"
        iconClass="me-2 text-primary-container"
        viewBox="0 0 16 16"
        icon="schedule_tick"
      />
    </app-info-field>

    @if (availableClass) {
      <app-info-field
        class="pb-1"
        classInfo="fs-17 fw-bold text-primary-container h5"
        label="Số lớp học có thể đăng ký"
        [value]="availableClass"
      >
        <app-dynamic-icon
          width="16"
          height="16"
          fill="currentColor"
          iconClass="me-2 text-primary-container"
          viewBox="0 0 16 16"
          icon="avai"
        />
      </app-info-field>
    }
  </div>
}

<section class="container mt-4">
  <a
    [routerLink]="
      isTeacher
        ? `/giao-vien/lop-hoc/${classSlug}`
        : `/admin/quan-ly-lop-hoc/${classSlug}/chi-tiet`
    "
    class="text-decoration-none back-btn"
  >
    <div class="d-flex align-items-center text-primary-container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="23"
        height="23"
        fill="currentColor"
        class="bi bi-arrow-left-short me-2 back-arrow"
        viewBox="0 0 16 16"
      >
        <path
          fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"
        />
      </svg>
      <span
        >Trở lại
        {{ isTeacher ? "danh sách bài học" : "chi tiết lớp học" }}</span
      >
    </div>
  </a>

  @if (sessionDateResponse) {
    <div class="row mb-3">
      <div class="col-12">
        <h3 class="mt-3 mb-2">
          Điểm danh học viên lớp {{ sessionDateResponse.className }}
        </h3>
        <div class="d-flex justify-content-between mb-3">
          <div class="d-flex align-items-center mb-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-person-fill me-2 text-primary-container"
              viewBox="0 0 16 16"
            >
              <path
                d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
              />
            </svg>
            <span class="text-primary-container fw-bold"
              >Giáo viên: {{ sessionDateResponse.teacherName }}</span
            >
          </div>
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12 col-lg-3">
        <app-attendance-sidebar
          [sessionDates]="sessionDates"
          [selectedDate]="selectedDate"
        />
      </div>
      <div class="col-12 col-lg-9">
        <app-attendance-main
          [lesson]="lesson"
          [attendanceRows]="attendanceRows"
          [selectedDate]="selectedDate"
          [enrollmentRows]="enrollments"
          (addAttendanceEmit)="onAddAttendances($event)"
          [classSlug]="classSlug"
        />
      </div>
    </div>
  } @else {
    <app-spinner />
  }
</section>

@if (class) {
  <div class="shadow bg-white px-4 py-4 rounded-4 mt-4">
    <a
      [routerLink]="`/danh-sach-lop-hoc-cua-giao-vien/${class.teacherId}`"
      [queryParams]="{
        page: 1,
      }"
      class="text-decoration-none teacher-link"
    >
      <app-info-field
        classInfo="text-primary fw-bold h5 mb-0"
        [value]="class.teacherName"
      >
        <app-dynamic-icon
          width="32"
          height="32"
          fill="currentColor"
          class="me-2 text-primary-container"
          viewBox="0 0 16 16"
          icon="person"
        />
      </app-info-field>
    </a>
    <div class="d-flex align-items-center mb-2 justify-content-between">
      <div class="d-flex align-items-center">
        <app-dynamic-icon
          width="20"
          height="20"
          fill="currentColor"
          class="ms-1 me-3 text-primary-container"
          viewBox="0 0 16 16"
          icon="cash"
        />
        <p class="text-dark mb-0 fw-bold">
          <span>Học phí:</span>
        </p>
      </div>
      <p class="text-danger fw-bold mb-0">
        <span class="h4 fw-bold">{{
          class.price | number: "1.0-2" : "vi"
        }}</span>
        <u>đ</u>
      </p>
    </div>
  </div>

  <div class="shadow-lg px-4 pt-4 pb-3 rounded-4 mt-4">
    <app-info-field
      label="Ngày khai giảng dự kiến"
      [value]="class.openingDate | date: 'dd/MM/yyyy'"
    >
      <app-dynamic-icon icon="flag_fill" />
    </app-info-field>

    <app-info-field
      classInfo="fw-bold text-success"
      label="Ngày bắt đầu"
      [value]="class.startDate | date: 'dd/MM/yyyy'"
    >
      <app-dynamic-icon icon="schedule" />
    </app-info-field>

    <app-info-field
      classInfo="fw-bold text-danger"
      label="Ngày kết thúc"
      [value]="class.endDate | date: 'dd/MM/yyyy'"
    >
      <app-dynamic-icon icon="schedule_tick_2" />
    </app-info-field>

    <app-info-field
      classInfo="fw-bold text-primary-container"
      label="Lịch học"
      [value]="class.classSchedule"
    >
      <app-dynamic-icon icon="clock" />
    </app-info-field>

    <app-info-field
      classInfo="fw-bold text-primary-container"
      label="Chỗ trống"
      [value]="`Còn ${class.availableSlots} chỗ`"
    >
      <app-dynamic-icon icon="bag_1" />
    </app-info-field>

    <app-info-field
      classInfo="fw-bold text-primary-container"
      label="Số học viên tối đa"
      [value]="class.maxStudents"
    >
      <app-dynamic-icon icon="presentation" />
    </app-info-field>
  </div>
}

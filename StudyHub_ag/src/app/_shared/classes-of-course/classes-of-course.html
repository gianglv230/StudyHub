@if (classes) {
  <div class="shadow-lg px-4 py-4 rounded-4 mt-4">
    <h3 style="font-size: 32px">Các lớp học</h3>
    <hr class="mb-4" />
    <div class="row g-4">
      @for (item of classes; track $index) {
        <div class="col-md-6 col-lg-6">
          <app-class-lite-card [card]="item" />
        </div>
      }
    </div>
  </div>
}

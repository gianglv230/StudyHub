<section class="container" [class]="class">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-12 col-lg-4 order-1 order-lg-0">
        <div class="bg-white rounded-4 shadow-sm pt-3 pb-4 px-4 mt-4 mt-lg-0">
          <div class="d-flex justify-content-center mb-3">
            <div class="avatar-border position-relative">
              <img
                src="assets/images/student.png"
                alt="Avatar"
                class="img-fluid rounded-circle avatar"
                width="140"
                height="140"
              />

              <div class="avatar-pencil">
                <app-dynamic-icon
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  icon="pencil_fill"
                  iconClass="text-white"
                />
              </div>
            </div>
          </div>
          <p class="text-center mb-3 text-primary-container h5 fw-normal">
            {{ fullname }}
          </p>
          <div class="d-flex justify-content-center">
            <div class="badge text-center role rounded-pill py-2 px-4">
              <div class="d-flex align-items-center">
                <app-dynamic-icon
                  width="20"
                  height="20"
                  fill="currentColor"
                  iconClass="me-2 text-white"
                  viewBox="0 0 16 16"
                  icon="mortarboard"
                />
                <span class="d-inline-block">{{ role }}</span>
              </div>
            </div>
          </div>
          <hr class="my-4" />
          <button
            type="button"
            class="btn btn-primary-custom w-100 py-2 fw-normal mb-2"
          >
            <app-dynamic-icon
              width="18"
              height="18"
              fill="currentColor"
              iconClass="me-2 text-white"
              viewBox="0 0 16 16"
              icon="floppy_fill"
            />
            <span>Lưu</span>
          </button>
          <button
            type="button"
            (click)="openChangePwdModal()"
            class="btn btn-outline-primary-custom w-100 py-2 fw-normal mt-1"
          >
            <app-dynamic-icon
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 16 16"
              iconClass="me-1"
              icon="arrow_clockwise"
            />
            <span>Thay đổi mật khẩu</span>
          </button>
        </div>
      </div>
      <div class="col-12 col-lg-8 order-0 order-lg-1">
        <div class="bg-white rounded-4 shadow-sm py-4 personal-info-form">
          <div class="d-flex justify-content-between px-4">
            <h3>Thông tin cá nhân</h3>
            @if (isAdmin) {
              <div class="d-flex align-items-center cursor-pointer">
                <button type="submit" class="btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-pencil-square text-primary-container me-2"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"
                    />
                    <path
                      fill-rule="evenodd"
                      d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"
                    />
                  </svg>
                  <span class="d-inline-block h5 mb-0 text-primary-container"
                    >Sửa</span
                  >
                </button>
              </div>
            }
          </div>
          <hr class="text-muted mt-2 mb-4" />
          <div class="px-4 text-primary-container">
            <div class="row g-3">
              <div class="col-6">
                <app-form-input
                  [control]="form.controls.firstName"
                  label="Họ và họ đệm"
                  [isFloating]="false"
                  placeholder="Nguyễn Văn"
                />
              </div>
              <div class="col-6">
                <app-form-input
                  [control]="form.controls.lastName"
                  label="Tên"
                  [isFloating]="false"
                  placeholder="A"
                />
              </div>
              <div class="col-6">
                <app-form-select
                  [control]="form.controls.gender"
                  label="Giới tính"
                  [data]="genderData"
                />
              </div>
              <div class="col-6">
                <app-form-input
                  [control]="form.controls.dateOfBirth"
                  type="date"
                  label="Ngày sinh"
                  [isFloating]="false"
                />
              </div>
              <div class="col-12">
                <app-form-input
                  [control]="form.controls.email"
                  type="email"
                  label="Email"
                  [isFloating]="false"
                  placeholder="studyhub@gmail.com"
                />
              </div>
              <div class="col-12">
                <app-form-input
                  [control]="form.controls.phone"
                  pattern="^\d{0,10}$"
                  label="Số điện thoại"
                  [isFloating]="false"
                />
              </div>
              <div class="col-12">
                <app-form-input
                  [control]="form.controls.hometown"
                  label="Quê quán"
                  [isFloating]="false"
                />
              </div>
              <div class="col-12">
                <app-form-input
                  [control]="form.controls.address"
                  label="Địa chỉ"
                  [isFloating]="false"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</section>

@if (classes && classes.length != 0) {
  <section class="container" [class]="class">
    <div
      class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end mb-4 pb-1 gap-3"
    >
      <div>
        @if (label) {
          <h2 [class]="classLabel" class="mb-1">{{ label }}</h2>
        }
      </div>
    </div>
    <div class="row g-4">
      @for (item of classes; track $index) {
        <div class="col-md-6 col-lg-4">
          <app-class-progress-card [card]="item" [isStudent]="isStudent"/>
        </div>
      }
    </div>
  </section>
}

<div class="lesson-content mb-3 pt-2">
  @for (item of classLessonTeacher?.sections; track item.id) {
    <div [class.d-none]="item.id !== currentSelectedSectionId">
      <h5 class="mt-2 mb-3 small">
        Phần {{ $index + 1 }}: {{ item.sectionName }}
      </h5>
      <app-lesson-main [section]="item" />
      <div class="mt-4">
        <app-lesson-minor [section]="item" />
      </div>
    </div>
  }
</div>

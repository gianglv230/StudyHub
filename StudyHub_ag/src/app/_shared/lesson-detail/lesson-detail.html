<section class="container-fluid px-4 mt-4">
  <div class="d-flex justify-content-between align-items-center">
    <a href="#" class="text-decoration-none back-btn">
      <div class="d-flex align-items-center text-primary-container">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="23"
          height="23"
          fill="currentColor"
          class="bi bi-arrow-left-short me-2 back-arrow"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"
          />
        </svg>
        <span>Trở lại danh sách bài học</span>
      </div>
    </a>
    <button class="btn btn-primary-custom py-0 h-50 py-1">Sửa</button>
  </div>
  @if (data) {
    <div class="row mb-2 mt-3">
      <div class="col-12 col-lg-8">
        <div class="bg-white rounded-4 px-2 mb-2">
          <app-lesson-content [classLessonTeacher]="data" />
        </div>
      </div>
      <div class="col-12 col-lg-4">
        <app-lesson-list [classLessonTeacher]="data" />
      </div>
    </div>
  }
</section>

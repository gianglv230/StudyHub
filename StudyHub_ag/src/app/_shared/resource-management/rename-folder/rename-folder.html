<div class="modal-body">
  <div class="px-3 pt-2">
    <div class="d-flex justify-content-between mb-2">
      <div class="h4 text-center text-primary-container text-uppercase fw-bold">
        Đổi tên thư mục
      </div>
      <div>
        <button
          type="button"
          class="btn-close"
          (click)="activeModal.dismiss()"
        ></button>
      </div>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-input
        [control]="form.controls.resourceName"
        type="text"
        [label]="`Tên cũ: ${data.resourceName}`"
        placeholder=""
      />
      <div class="text-center">
        <button class="btn-primary-custom" type="submit">Sửa</button>
      </div>
    </form>
  </div>
</div>
